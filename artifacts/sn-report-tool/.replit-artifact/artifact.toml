kind = "web"
previewPath = "/"
title = "ServiceNow Report Tool"
version = "1.0.0"
id = "artifacts/sn-report-tool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20398

[services.development]
run = "pnpm --filter @workspace/sn-report-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sn-report-tool", "run", "build" ]
publicDir = "artifacts/sn-report-tool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20398"
BASE_PATH = "/"
