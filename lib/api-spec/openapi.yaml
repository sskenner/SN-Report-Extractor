openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: servicenow
    description: ServiceNow connectivity operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /servicenow/ping:
    get:
      operationId: servicenowPing
      tags: [servicenow]
      summary: Test ServiceNow connectivity
      description: Makes a lightweight request to the configured ServiceNow instance and returns connection status
      responses:
        "200":
          description: Connection result (ok=true means connected, ok=false means failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PingResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the connection to ServiceNow succeeded
        instance:
          type: string
          description: The ServiceNow instance URL that was tested
        latencyMs:
          type: number
          description: Round-trip latency in milliseconds
        error:
          type: string
          description: Error message if ok=false
      required:
        - ok
        - instance
        - latencyMs
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
